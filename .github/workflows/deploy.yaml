name: Deploy to Cloudflare Workers

# The hub runs on Cloudflare (Worker via @opennextjs/cloudflare), not the
# homelab. Push to main → build the OpenNext worker → wrangler deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --include=dev

      - name: Build (OpenNext → Cloudflare Worker)
        run: npm run cf:build
        env:
          # PAT with `repo` scope (or fine-grained equivalent). Used by
          # scripts/gen-project-stats.mjs to pull build-time stats from
          # public + private repos across orgs (gavinmcfall/*, SC-Bridge/*,
          # Realmstacks/*). If absent the build still succeeds — stats just
          # render as em-dashes.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Deploy (wrangler)
        run: ./node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
